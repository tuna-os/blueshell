name: upstream-sync

# Attempts a weekly rebase of ptyxis-port onto ghostty-org/ghostty:main.
#
# - Clean rebase  → push a sync branch + open a PR
# - Conflicts     → open an issue with the conflicted files + upstream
#                   commit range, link to CONFLICT_HOTSPOTS.md
#
# Either path runs the toolbox/Zig build to make sure upstream's
# changes didn't break ours.

on:
  schedule:
    # Mondays 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout ptyxis-port
        uses: actions/checkout@v7
        with:
          ref: ptyxis-port
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git author
        run: |
          git config user.name "ptyxis-port-sync"
          git config user.email "ptyxis-port-sync@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/ghostty-org/ghostty.git

      - name: Fetch upstream
        run: |
          # The fork keeps its own rolling `tip` tag (release-tip.yml) and
          # upstream has an unrelated tag of the same name. A plain --tags
          # fetch rejects it ("would clobber existing tag") and exits 1 even
          # though upstream/main arrived fine — failing every sync run since
          # the collision appeared. --force only affects this throwaway
          # runner checkout (the workflow pushes only the sync branch, never
          # tags).
          git fetch upstream main --tags --force

      - name: Compute sync metadata
        id: meta
        run: |
          upstream_sha=$(git rev-parse upstream/main)
          upstream_short=$(git rev-parse --short upstream/main)
          base_sha=$(git merge-base HEAD upstream/main)
          range_count=$(git rev-list --count "${base_sha}..upstream/main")
          date=$(date -u +'%Y-%m-%d')
          branch="upstream-sync/${date}"
          echo "upstream_sha=${upstream_sha}"      >> "$GITHUB_OUTPUT"
          echo "upstream_short=${upstream_short}"  >> "$GITHUB_OUTPUT"
          echo "base_sha=${base_sha}"              >> "$GITHUB_OUTPUT"
          echo "range_count=${range_count}"        >> "$GITHUB_OUTPUT"
          echo "date=${date}"                      >> "$GITHUB_OUTPUT"
          echo "branch=${branch}"                  >> "$GITHUB_OUTPUT"

      - name: Short-circuit if already up to date or a sync is in flight
        id: uptodate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `HEAD == upstream_sha` can never be true here: ptyxis-port is
          # upstream plus our patch set, so its tip is by definition not
          # upstream's tip. The question is whether upstream's HEAD is
          # already *contained* in ours.
          if git merge-base --is-ancestor \
               "${{ steps.meta.outputs.upstream_sha }}" HEAD; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ptyxis-port already contains upstream ${{ steps.meta.outputs.upstream_short }}."
            exit 0
          fi
          # Don't stack sync branches. If the previous sync PR hasn't been
          # dealt with, a second one covers an overlapping commit range and
          # the two conflict with each other rather than with upstream.
          open_sync=$(gh pr list --state open --base ptyxis-port \
            --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("upstream-sync/"))] | length')
          if [ "${open_sync}" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::An upstream-sync PR is already open — skipping this run. Merge or close it to resume."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Attempt rebase
        id: rebase
        if: steps.uptodate.outputs.skip == 'false'
        run: |
          git switch -c "${{ steps.meta.outputs.branch }}"
          if git rebase upstream/main; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            # Collect conflict info before aborting.
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
            git rebase --abort || true
          fi

      # --- Clean rebase path ---------------------------------------------

      - name: Push sync branch (clean rebase)
        if: steps.uptodate.outputs.skip == 'false' && steps.rebase.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push origin "${{ steps.meta.outputs.branch }}" --force-with-lease

      - name: Open PR (clean rebase)
        if: steps.uptodate.outputs.skip == 'false' && steps.rebase.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base ptyxis-port \
            --head "${{ steps.meta.outputs.branch }}" \
            --title "chore: rebase onto upstream ${{ steps.meta.outputs.upstream_short }}" \
            --body "$(cat <<EOF
          Automated weekly rebase of \`ptyxis-port\` onto \`ghostty-org/ghostty:main\`.

          - Upstream HEAD: \`${{ steps.meta.outputs.upstream_sha }}\`
          - Upstream commits since last base: ${{ steps.meta.outputs.range_count }}
          - Previous base: \`${{ steps.meta.outputs.base_sha }}\`

          Rebase was clean — no conflicts in our downstream patches. Build verification still pending; merge after CI.

          Upstream commit log:
          \`\`\`
          $(git log --oneline ${{ steps.meta.outputs.base_sha }}..upstream/main | head -50)
          \`\`\`
          EOF
          )"

      # --- Conflict path -------------------------------------------------

      - name: Open issue (conflicts)
        if: steps.uptodate.outputs.skip == 'false' && steps.rebase.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conflicts="$(cat /tmp/conflicts.txt)"
          gh issue create \
            --title "upstream-sync ${{ steps.meta.outputs.date }}: rebase conflicts on ${{ steps.meta.outputs.upstream_short }}" \
            --label upstream-sync \
            --body "$(cat <<EOF
          Automated rebase onto upstream \`${{ steps.meta.outputs.upstream_sha }}\` hit conflicts. Resolve locally, see \`CONFLICT_HOTSPOTS.md\` for guidance per file.

          ## Conflicted files

          \`\`\`
          ${conflicts}
          \`\`\`

          ## Upstream range

          ${{ steps.meta.outputs.range_count }} commits in \`${{ steps.meta.outputs.base_sha }}..${{ steps.meta.outputs.upstream_sha }}\`.

          To reproduce locally:

          \`\`\`bash
          git fetch upstream main
          git switch -c upstream-sync/${{ steps.meta.outputs.date }} ptyxis-port
          git rebase upstream/main
          # resolve, then: git push -u origin upstream-sync/${{ steps.meta.outputs.date }}
          \`\`\`

          Upstream commit log:
          \`\`\`
          $(git log --oneline ${{ steps.meta.outputs.base_sha }}..upstream/main | head -50)
          \`\`\`
          EOF
          )"

      - name: Summary
        if: always()
        run: |
          echo "## upstream-sync result" >> "$GITHUB_STEP_SUMMARY"
          echo "- date: ${{ steps.meta.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- upstream: ${{ steps.meta.outputs.upstream_short }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- skipped (up to date, or a sync PR is already open): ${{ steps.uptodate.outputs.skip }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- clean rebase: ${{ steps.rebase.outputs.clean }}" >> "$GITHUB_STEP_SUMMARY"
