on:
  discussion_comment:
    types: [created]

name: "Vouch - Manage by Discussion"

concurrency:
  group: vouch-manage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `secrets` cannot be referenced in `if:` conditions at all, so mirror
    # the app credentials into env first: empty env means "not configured".
    # Without this guard every run fails in create-github-app-token with
    # "client-id must be set to a non-empty string".
    env:
      VOUCH_APP_ID: ${{ secrets.VOUCH_APP_ID }}
      VOUCH_APP_PRIVATE_KEY: ${{ secrets.VOUCH_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.VOUCH_APP_ID != '' && env.VOUCH_APP_PRIVATE_KEY != ''
        with:
          app-id: ${{ env.VOUCH_APP_ID }}
          private-key: ${{ env.VOUCH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.app-token.outputs.token != ''
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: mitchellh/vouch/action/manage-by-discussion@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
        if: steps.app-token.outputs.token != ''
        with:
          discussion-number: ${{ github.event.discussion.number }}
          comment-node-id: ${{ github.event.comment.node_id }}
          vouch-keyword: "!vouch"
          denounce-keyword: "!denounce"
          unvouch-keyword: "!unvouch"
          pull-request: "true"
          merge-immediately: "true"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
