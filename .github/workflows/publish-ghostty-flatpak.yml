name: Publish Ghostty Flatpak

# Republish stock upstream Ghostty (com.mitchellh.ghostty) onto the TunaOS
# Flatpak remote, alongside Blueshell. The app is built from a pinned
# upstream commit (see `commit:` in flatpak/com.mitchellh.ghostty.yml)
# with one TunaOS addition: a launcher wrapper that passes the host's
# ~/.config/ghostty as optional config files, because Flatpak redirects
# XDG_CONFIG_HOME into the sandbox and the host config would otherwise
# never be read (tuna-os/blueshell#117). No patches to upstream's source.
#
# Because the app IDs differ (com.mitchellh.ghostty vs org.tunaos.blueshell),
# a user can install both side by side from the one remote.
#
# This lives in blueshell rather than in a tuna-os/ghostty fork because a
# fork would be a repo whose only original content is this file, with a
# second FLATPAK_INDEX_TOKEN to provision and an upstream-sync mechanism to
# maintain. The registry path and index entry are still ghostty's own
# (tuna-os/ghostty), separate from blueshell's.
#
# The body is the canonical tuna-os pipeline in tuna-os/.github, the same
# reusable workflow finupdate, mariner, mandelbrot, dualcut and the four
# installer frontends call. This file is only the trigger policy.
#
# Bumping the pinned upstream: update `commit:` in
# flatpak/ghostty-stock/com.mitchellh.ghostty.yml, refresh the two
# vendored files noted in flatpak/ghostty-stock/dependencies.yml, and
# diff the module's build-commands against the new ref's own manifest.
# Open a PR; the build-only job below validates it without publishing.

on:
  schedule:
    # Sundays 05:00 UTC. Weekly rather than daily because the reusable
    # pipeline has no "upstream unchanged" short-circuit -- every run is two
    # full Zig builds (x86_64 + aarch64, ~11 min each), and a republished
    # upstream terminal does not need same-day freshness.
    - cron: '0 5 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - flatpak/ghostty-stock/**
      - .github/workflows/publish-ghostty-flatpak.yml
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    # Forks don't publish. A fork running this on dispatch would push to its
    # own ghcr namespace, and -- if it also carried FLATPAK_INDEX_TOKEN --
    # would write an image nobody in the org built into the shared index.
    if: github.repository == 'tuna-os/blueshell'
    # The called workflow requires both permissions, including on PR runs.
    permissions:
      contents: write
      packages: write
    uses: tuna-os/.github/.github/workflows/publish-flatpak.yml@main
    with:
      app-id: com.mitchellh.ghostty
      manifest-path: flatpak/ghostty-stock/com.mitchellh.ghostty.yml
      # Registry path and central-index entry, deliberately not this repo:
      # ghcr.io/tuna-os/ghostty, so it doesn't collide with blueshell's own
      # entry. The package is created under the org by this repo's
      # GITHUB_TOKEN and must be made public once, by hand, after the first
      # successful run -- a private package fails to install exactly like a
      # missing one.
      repo-name: tuna-os/ghostty
      # Pull requests only validate the build; schedule and dispatch publish.
      # (Never "whatever upstream main is this Sunday". The 2026-09-20 run
      # built main at 27e8b3f, right after upstream replaced GtkGLArea with
      # direct EGL/dmabuf rendering. On Mesa's software renderer (every VM
      # without GPU passthrough, including Utah's install e2e) that surface
      # never initialises ("ZINK: failed to choose pdev", then
      # "gtk_ghostty_surface: failed to initialize surface
      # err=error.NotInitialized"): no window at all. Utah's post-testing e2e
      # went red on every flavor.
      #
      # So scheduled runs build the pinned, known-good upstream commit in
      # the manifest. Bump it deliberately via PR after checking the
      # build-only job here and the app in a VM. The current pin is
      # upstream main from 2026-09-13, which Utah's e2e passed with.)
      publish: ${{ github.event_name != 'pull_request' }}
      # No bundles on the GitHub release: these are upstream's builds, and
      # this repo's releases are Blueshell's.
      attach-bundles: false
    secrets: inherit
