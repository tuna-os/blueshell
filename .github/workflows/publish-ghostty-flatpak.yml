name: Publish Ghostty Flatpak

# Republish stock upstream Ghostty (com.mitchellh.ghostty) onto the TunaOS
# Flatpak remote, alongside Blueshell. The app is built from a pinned
# upstream commit (see `commit:` in flatpak/com.mitchellh.ghostty.yml)
# with one TunaOS addition: a launcher wrapper that passes the host's
# ~/.config/ghostty as optional config files, because Flatpak redirects
# XDG_CONFIG_HOME into the sandbox and the host config would otherwise
# never be read (tuna-os/blueshell#117). No patches to upstream's source.
#
# Because the app IDs differ (com.mitchellh.ghostty vs org.tunaos.blueshell),
# a user can install both side by side from the one remote.
#
# This lives in blueshell rather than in a tuna-os/ghostty fork because a
# fork would be a repo whose only original content is this file, with a
# second index credential (FLATPAK_INDEX_DEPLOY_KEY) to provision and an
# upstream-sync mechanism to maintain. The registry path and index entry are
# still ghostty's own (tuna-os/ghostty), separate from blueshell's.
#
# The body is the canonical tuna-os pipeline in tuna-os/.github, the same
# reusable workflow mariner, mandelbrot, dualcut and the four
# installer frontends call. This file is only the trigger policy.
#
# Bumping the pinned upstream: update `commit:` in
# flatpak/ghostty-stock/com.mitchellh.ghostty.yml, refresh the two
# vendored files noted in flatpak/ghostty-stock/dependencies.yml, and
# diff the module's build-commands against the new ref's own manifest.
# Open a PR; the build-only job below validates it without publishing.

on:
  schedule:
    # Sundays 05:00 UTC. Weekly rather than daily because the reusable
    # pipeline has no "upstream unchanged" short-circuit -- every run is two
    # full Zig builds (x86_64 + aarch64, ~11 min each), and a republished
    # upstream terminal does not need same-day freshness.
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      release-tarballs:
        description: Publish a new versioned Ghostty /app-tree release after validation
        type: boolean
        default: false
  pull_request:
    paths:
      - flatpak/ghostty-stock/**
      - .github/workflows/publish-ghostty-flatpak.yml
      - .github/scripts/*ghostty-release.py
      - .github/scripts/tests/test_ghostty_release.py
      - .github/scripts/tests/ghostty-oci-roundtrip.sh
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    # Forks don't publish. A fork running this on dispatch would push to its
    # own ghcr namespace, and -- if it also carried FLATPAK_INDEX_DEPLOY_KEY --
    # would write an image nobody in the org built into the shared index.
    # NOTE: `github.repository` is always the base repo, even for fork PRs,
    # so compare the PR head repo instead. The secrets forwarded below
    # (FLATPAK_INDEX_DEPLOY_KEY, the docs deploy key
    # the called workflow pushes the index with) are unavailable on
    # cross-repo PRs, so a fork PR is skipped rather than run without them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # The called workflow requires both permissions, including on PR runs.
    permissions:
      contents: write
      packages: write
    uses: tuna-os/.github/.github/workflows/publish-flatpak.yml@4078f531ac74703f203bde835ef6c25e9321b97b # main # zizmor: ignore[ref-version-mismatch] pinned to a reviewed main commit; Renovate bumps the digest, so main may be ahead
    with:
      app-id: com.mitchellh.ghostty
      manifest-path: flatpak/ghostty-stock/com.mitchellh.ghostty.yml
      # Registry path and central-index entry, deliberately not this repo:
      # ghcr.io/tuna-os/ghostty, so it doesn't collide with blueshell's own
      # entry. The package is created under the org by this repo's
      # GITHUB_TOKEN and must be made public once, by hand, after the first
      # successful run -- a private package fails to install exactly like a
      # missing one.
      repo-name: tuna-os/ghostty
      # Pull requests only validate the build; schedule and dispatch publish.
      # (Never "whatever upstream main is this Sunday". The 2026-09-20 run
      # built main at 27e8b3f, right after upstream replaced GtkGLArea with
      # direct EGL/dmabuf rendering. On Mesa's software renderer (every VM
      # without GPU passthrough, including Utah's install e2e) that surface
      # never initialises ("ZINK: failed to choose pdev", then
      # "gtk_ghostty_surface: failed to initialize surface
      # err=error.NotInitialized"): no window at all. Utah's post-testing e2e
      # went red on every flavor.
      #
      # So scheduled runs build the pinned, known-good upstream commit in
      # the manifest. Bump it deliberately via PR after checking the
      # build-only job here and the app in a VM. The current pin is
      # upstream main from 2026-09-13, which Utah's e2e passed with.)
      publish: ${{ github.event_name != 'pull_request' }}
      # FlatPark needs /app-tree tarballs, not .flatpak bundles. The jobs
      # below export the shared build's OCI artifacts into a separate release.
      attach-bundles: false
    # The only secrets the called workflow declares and reads.
    secrets:
      FLATPAK_INDEX_DEPLOY_KEY: ${{ secrets.FLATPAK_INDEX_DEPLOY_KEY }}
      FLATPAK_INDEX_TOKEN: ${{ secrets.FLATPAK_INDEX_TOKEN }}

  export-tarballs:
    name: Export Ghostty release (${{ matrix.arch }})
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: oci-${{ matrix.arch }}
          path: oci
      - name: Install export tools
        run: sudo apt-get update && sudo apt-get install -y flatpak ostree
      - name: Test archive and receipt validation
        run: python3 -m unittest discover -s .github/scripts/tests -p test_ghostty_release.py -v
      - name: Test Flatpak OCI round trip for both architectures
        run: bash .github/scripts/tests/ghostty-oci-roundtrip.sh
      - name: Export actual built app tree
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 .github/scripts/export-ghostty-release.py \
            --oci oci --arch "$ARCH" --source-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --manifest flatpak/ghostty-stock/com.mitchellh.ghostty.yml --output release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ghostty-release-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release-tarballs:
    name: Publish versioned Ghostty tarballs
    needs: export-tarballs
    if: >-
      github.repository == 'tuna-os/blueshell' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/ptyxis-port' && inputs.release-tarballs
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: ghostty-release-*
          path: release
          merge-multiple: true
      - name: Create a new release, verify uploaded bytes, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(python3 .github/scripts/prepare-ghostty-release.py release)
          # Create only: no clobber, force-push, or editing any prior release.
          # Run attempt is part of the identity; a retry gets a fresh release.
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Ghostty (Tuna packaging) $tag" \
            --notes-file release/release-notes.md --draft --latest=false \
            release/*.tar.gz release/*.json release/SHA256SUMS
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir verified
          cmp release/release.json verified/release.json
          python3 .github/scripts/prepare-ghostty-release.py verified
          cmp release/release.json verified/release.json
          (cd verified && sha256sum -c SHA256SUMS)
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets \
            >> "$GITHUB_STEP_SUMMARY"
