on:
  issues:
    types: [opened, reopened]

name: "Vouch - Check Issue"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `secrets` cannot be referenced in `if:` conditions at all, so mirror
    # the app credentials into env first: empty env means "not configured".
    # Without this guard every run fails in create-github-app-token with
    # "client-id must be set to a non-empty string".
    env:
      VOUCH_APP_ID: ${{ secrets.VOUCH_APP_ID }}
      VOUCH_APP_PRIVATE_KEY: ${{ secrets.VOUCH_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/create-github-app-token@v3.3.0  # zizmor: ignore[github-app] vouch needs the app installation scopes; narrowing the token changes behaviour
        id: app-token
        if: env.VOUCH_APP_ID != '' && env.VOUCH_APP_PRIVATE_KEY != ''
        with:
          app-id: ${{ env.VOUCH_APP_ID }}
          private-key: ${{ env.VOUCH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/issue-unvouched-message

      - uses: mitchellh/vouch/action/check-issue@v1.5.0
        if: steps.app-token.outputs.token != ''
        with:
          issue-number: ${{ github.event.issue.number }}
          auto-close: true
          auto-lock: true
          template-file: .github/issue-unvouched-message
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
