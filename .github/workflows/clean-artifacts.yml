name: Clean Artifacts
on:
  schedule:
    # Once a day
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-old-artifacts:
    permissions:
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove old artifacts
        uses: c-hive/gha-remove-artifacts@v1.8.0
        with:
          age: "1 week"
          skip-tags: true
          skip-recent: 5
