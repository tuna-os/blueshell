name: Publish Flatpak

# Build BlueShell as a Flatpak OCI image for x86_64 and aarch64, push both
# to GHCR, and update the TunaOS Flatpak index (tunaos.org/flatpak) so
# `flatpak install tuna-os org.tunaos.BlueShell` serves current builds.
#
# Modelled verbatim on tuna-os/finupdate's publish-flatpak.yml (the
# canonical tuna-os flatpak pipeline), with the same two inherited
# decisions: each arch builds natively on its own runner (no QEMU), and
# skopeo gets a writable auth file.
#
# Push-triggered publishes gate on the repo living in the tuna-os org;
# manual dispatch also works from forks: the image then goes to the fork
# owner's ghcr namespace, and the tuna-os/docs index update runs when the
# FLATPAK_INDEX_TOKEN secret is set.

on:
  push:
    branches: [ptyxis-port]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  APP_ID: org.tunaos.BlueShell
  MANIFEST: flatpak/org.tunaos.BlueShell.yml
  # ghcr.io/<owner>/blueshell — tuna-os after the transfer, the fork
  # owner before it (GITHUB_TOKEN can only write its own namespace).
  IMAGE: ghcr.io/${{ github.repository_owner }}/blueshell

jobs:
  build-oci:
    name: Build OCI — ${{ matrix.arch }}
    # Push-triggered publishes only from the tuna-os org repo; manual
    # dispatch works from anywhere (pre-transfer publishing pushes the
    # image to the dispatching owner's ghcr namespace instead).
    if: github.repository == 'tuna-os/blueshell' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ env.MANIFEST }}
          cache-key: flatpak-publish-${{ github.sha }}-${{ matrix.arch }}
          bundle: blueshell-${{ matrix.arch }}.flatpak
          upload-artifact: false
          arch: ${{ matrix.arch }}

      - name: Export OCI
        run: |
          flatpak build-bundle --oci --arch=${{ matrix.arch }} \
            repo blueshell-${{ matrix.arch }}.oci "$APP_ID"

      - name: Upload OCI artifact
        uses: actions/upload-artifact@v7
        with:
          name: blueshell-${{ matrix.arch }}-oci
          path: blueshell-${{ matrix.arch }}.oci/
          retention-days: 1

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: blueshell-${{ matrix.arch }}-bundle
          path: blueshell-${{ matrix.arch }}.flatpak
          retention-days: 7

  publish:
    name: Publish
    needs: build-oci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: blueshell-x86_64-oci
          # upload-artifact flattens a single-directory `path` to the artifact
          # root, so each arch must download into its own subdirectory.
          path: blueshell-x86_64.oci

      - uses: actions/download-artifact@v8
        with:
          name: blueshell-aarch64-oci
          path: blueshell-aarch64.oci

      - name: Push OCI to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json
        run: |
          echo "${{ env.GITHUB_TOKEN }}" \
            | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          skopeo copy oci:blueshell-x86_64.oci \
            "docker://${IMAGE}:latest-x86_64"
          skopeo copy oci:blueshell-aarch64.oci \
            "docker://${IMAGE}:latest-aarch64"

      - name: Generate index snippet (always)
        run: |
          for arch in x86_64 aarch64; do
            python3 .github/scripts/update-index.py \
              --oci-dir "blueshell-${arch}.oci" \
              --index-file blueshell-index-snippet.json \
              --repo-name "${{ github.repository_owner }}/blueshell" \
              --tags latest
          done
          cat blueshell-index-snippet.json

      - name: Upload index snippet
        uses: actions/upload-artifact@v7
        with:
          name: blueshell-index-snippet
          path: blueshell-index-snippet.json
          retention-days: 30

      - name: Update central index (tuna-os/docs)
        env:
          FLATPAK_INDEX_TOKEN: ${{ secrets.FLATPAK_INDEX_TOKEN }}
        run: |
          if [ -z "$FLATPAK_INDEX_TOKEN" ]; then
            echo "::notice::FLATPAK_INDEX_TOKEN not set — skipping tuna-os/docs index update."
            echo "::notice::To publish into the remote: add a PAT with push access to tuna-os/docs as FLATPAK_INDEX_TOKEN and re-run, or merge the blueshell-index-snippet artifact's Results entry into tuna-os/docs:static/flatpak/index/static manually."
            exit 0
          fi
          git clone --depth 1 \
            https://github.com/tuna-os/docs.git \
            index-repo
          # Header-based auth so the token never lands in the remote URL.
          git -C index-repo config --local http.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FLATPAK_INDEX_TOKEN" | base64)"
          for arch in x86_64 aarch64; do
            python3 .github/scripts/update-index.py \
              --oci-dir "blueshell-${arch}.oci" \
              --index-file index-repo/static/flatpak/index/static \
              --repo-name "${{ github.repository_owner }}/blueshell" \
              --tags latest
          done
          cd index-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/flatpak/index/static
          if git diff --cached --quiet; then
            echo "No index changes"
          else
            git commit -m "chore(flatpak): update blueshell OCI index (x86_64 + aarch64)"
            git push origin main
          fi

  release-bundles:
    name: Attach bundles to release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-bundle'
          merge-multiple: true
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" *.flatpak --clobber \
            --repo "${GITHUB_REPOSITORY}"
