name: publish-flatpak

# Publishes BlueShell to the TunaOS Flatpak remote
# (https://tunaos.org/flatpak/): builds the flatpak, exports it as an
# OCI image, pushes to ghcr.io/tuna-os, and pings the index in
# tuna-os/docs so Cloudflare Pages redeploys the remote.
#
# This workflow is inert until the repo lives in the tuna-os org (see
# docs/TUNA_OS_PROMOTION.md): it gates on the repository name and needs
# the FLATPAK_INDEX_TOKEN secret (PAT with write access to tuna-os/docs).

on:
  push:
    branches: [ptyxis-port]
  workflow_dispatch: {}

env:
  # Flip to org.tunaos.BlueShell when the app-id rename lands
  # (docs/TUNA_OS_PROMOTION.md step 2).
  APP_ID: dev.hanthor.BlueShell
  IMAGE: ghcr.io/tuna-os/blueshell

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-flatpak
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'tuna-os/blueshell'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build flatpak repo
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/${{ env.APP_ID }}.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Export OCI image and push to ghcr.io
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            skopeo login --username "${{ github.actor }}" --password-stdin ghcr.io
          # flatpak-builder leaves an ostree repo in ./repo. Export the
          # app ref as an OCI image tagged latest + the commit sha.
          # (flatpak supports OCI as a native repo format; skopeo can
          # read the exported oci layout directly.)
          mkdir -p oci-out
          flatpak build-bundle --oci repo oci-out "${APP_ID}"
          skopeo copy "oci:oci-out" "docker://${IMAGE}:latest"
          skopeo copy "oci:oci-out" "docker://${IMAGE}:${GITHUB_SHA::12}"

      - name: Update TunaOS flatpak index
        env:
          GH_TOKEN: ${{ secrets.FLATPAK_INDEX_TOKEN }}
        run: |
          set -euo pipefail
          # Register/refresh this app's entry in the central index
          # (tuna-os/docs → served at tunaos.org/flatpak). The index is
          # a JSON array of {app-id, oci-ref, metadata}; trigger the
          # docs repo's update workflow rather than editing in place.
          gh workflow run flatpak-index-update.yml \
            --repo tuna-os/docs \
            -f app_id="${APP_ID}" \
            -f oci_ref="${IMAGE}:latest" \
            || echo "::warning::index update hook failed — register manually per docs/TUNA_OS_PROMOTION.md"
