on:
  pull_request_target:
    types: [opened, reopened]

name: "Vouch - Check PR"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VOUCH_APP_ID: ${{ secrets.VOUCH_APP_ID }}
      VOUCH_APP_PRIVATE_KEY: ${{ secrets.VOUCH_APP_PRIVATE_KEY }}
    steps:
      # Forks may inherit this workflow without installing the Vouch app.
      # Keep authentication errors fatal when credentials are configured.
      - name: Report unconfigured Vouch app
        if: env.VOUCH_APP_ID == '' || env.VOUCH_APP_PRIVATE_KEY == ''
        run: echo "::notice::Vouch PR checking is disabled until both VOUCH_APP_ID and VOUCH_APP_PRIVATE_KEY are configured."

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: env.VOUCH_APP_ID != '' && env.VOUCH_APP_PRIVATE_KEY != ''
        id: app-token
        with:
          app-id: ${{ secrets.VOUCH_APP_ID }}
          private-key: ${{ secrets.VOUCH_APP_PRIVATE_KEY }}

      - uses: mitchellh/vouch/action/check-pr@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
        if: env.VOUCH_APP_ID != '' && env.VOUCH_APP_PRIVATE_KEY != ''
        with:
          pr-number: ${{ github.event.pull_request.number }}
          auto-close: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
