on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers] vouch reads PR metadata only; no PR code is checked out or run
    types: [opened, reopened]

name: "Vouch - Check PR"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `secrets` cannot be referenced in `if:` conditions at all, so mirror
    # the app credentials into env first: empty env means "not configured".
    # Without this guard every run fails in create-github-app-token with
    # "client-id must be set to a non-empty string".
    env:
      VOUCH_APP_ID: ${{ secrets.VOUCH_APP_ID }}
      VOUCH_APP_PRIVATE_KEY: ${{ secrets.VOUCH_APP_PRIVATE_KEY }}
    steps:
      # Forks may inherit this workflow without installing the Vouch app.
      # (Kept from hive/194-kwi-findings: surface the skip as a notice.)
      - name: Report unconfigured Vouch app
        if: env.VOUCH_APP_ID == '' || env.VOUCH_APP_PRIVATE_KEY == ''
        run: echo "::notice::Vouch PR checking is disabled until both VOUCH_APP_ID and VOUCH_APP_PRIVATE_KEY are configured."

      - uses: actions/create-github-app-token@v3.3.0  # zizmor: ignore[github-app] vouch needs the app installation scopes; narrowing the token changes behaviour
        id: app-token
        if: env.VOUCH_APP_ID != '' && env.VOUCH_APP_PRIVATE_KEY != ''
        with:
          app-id: ${{ env.VOUCH_APP_ID }}
          private-key: ${{ env.VOUCH_APP_PRIVATE_KEY }}

      - uses: mitchellh/vouch/action/check-pr@v1.5.0
        if: steps.app-token.outputs.token != ''
        with:
          pr-number: ${{ github.event.pull_request.number }}
          auto-close: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
