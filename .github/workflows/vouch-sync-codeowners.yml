on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday at midnight UTC
  workflow_dispatch:

name: "Vouch - Sync CODEOWNERS"

concurrency:
  group: vouch-manage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `secrets` cannot be referenced in `if:` conditions at all, so mirror
    # the app credentials into env first: empty env means "not configured".
    # Without this guard every run fails in create-github-app-token with
    # "client-id must be set to a non-empty string".
    env:
      VOUCH_APP_ID: ${{ secrets.VOUCH_APP_ID }}
      VOUCH_APP_PRIVATE_KEY: ${{ secrets.VOUCH_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.VOUCH_APP_ID != '' && env.VOUCH_APP_PRIVATE_KEY != ''
        with:
          app-id: ${{ env.VOUCH_APP_ID }}
          private-key: ${{ env.VOUCH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: mitchellh/vouch/action/sync-codeowners@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
        if: steps.app-token.outputs.token != ''
        with:
          repo: ${{ github.repository }}
          pull-request: "true"
          merge-immediately: "true"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
