name: Blueshell Flatpak

on:
  push:
    branches: [ptyxis-port]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      # flatpak-builder updates the runtimes baked into the image. Some
      # runner hosts' overlayfs cannot rename image-layer directories, and
      # that update fails with "Invalid cross-device link". The action
      # copies the installation up only on those hosts (tuna-os/.github#380).
      - name: Make the image's Flatpak installations updatable
        uses: tuna-os/.github/.github/actions/flatpak-copy-up@6c76230bdd69e19634d9c74d5e3edbd8eacadd9f # main  # zizmor: ignore[ref-version-mismatch] pinned to a reviewed main commit; Renovate bumps the digest, so main may be ahead

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: blueshell.flatpak
          manifest-path: flatpak/org.tunaos.blueshell.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true
