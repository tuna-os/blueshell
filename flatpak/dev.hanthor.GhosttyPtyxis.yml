app-id: dev.hanthor.GhosttyPtyxis
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
default-branch: master
command: ghostty
finish-args:
  # 3D rendering
  - --device=dri
  # use host PTS namespace + container sockets
  - --device=all
  # Windowing
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Allow user to specify additional config files in home by default
  - --filesystem=home:ro
  # So we can escape the sandbox to spawn host shells
  - --talk-name=org.freedesktop.Flatpak
  # podman socket (containers picker)
  - --filesystem=xdg-run/podman
  # toolbox / distrobox use podman too; nothing extra needed
cleanup:
  - /include
  - /lib/girepository-1.0
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/pkgconfig
  - /share/vala
  - "*.la"
  - "*.a"
  - "*.so"

modules:
  # Inherit Ghostty's heavy dependencies (Zig, Wayland, libadwaita pin, etc).
  - dependencies.yml

  # Bundled ptyxis-agent. Lives at /app/libexec/ptyxis-agent so the
  # resolveAgentPath() fallback finds it without any env var.
  - name: ptyxis-agent
    buildsystem: meson
    config-opts:
      - --libexecdir=/app/libexec
    sources:
      - type: dir
        path: ../third_party/ptyxis-agent

  - name: ghostty
    buildsystem: simple
    build-options:
      append-path: /app/zig
    build-commands:
      - zig build
        -Doptimize=ReleaseFast
        -Dcpu=baseline
        -Dflatpak=true
        -Dstrip=false
        -fno-sys=oniguruma
        --prefix /app
        --search-prefix /app
        --system $PWD/vendor/p
    sources:
      - type: dir
        path: ..
        skip:
          - flatpak/.flatpak-builder
          - flatpak/builddir
          - flatpak/repo
          - zig-cache
          - zig-out

      - zig-packages.json
